name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            e2e/pnpm-lock.yaml

      - name: Preparar .env
        run: cp .env.example .env

      - name: Instalar frontend y E2E
        run: |
          cd frontend && pnpm install --frozen-lockfile
          cd ../e2e && pnpm install --frozen-lockfile

      - name: Instalar navegador de Playwright
        run: cd e2e && pnpm exec playwright install --with-deps chromium

      - name: Levantar backend
        run: |
          cd backend
          go build -o /tmp/energia-api ./cmd/api
          (/tmp/energia-api &)
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && break || sleep 1
          done

      - name: Levantar frontend
        run: |
          cd frontend
          (pnpm dev &)
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173 && break || sleep 1
          done

      - name: Correr suite E2E
        run: cd e2e && pnpm test

      - name: Escaneo de vulnerabilidades de Go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd backend && govulncheck ./...
        continue-on-error: true

      - name: Subir reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
